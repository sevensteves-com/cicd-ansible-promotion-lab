---
name: Lint and Validate

"on":
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate lab
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: pip install ruff yamllint

      - name: Validate manifest and Python
        run: |
          python scripts/prod_components.py validate
          ruff check scripts/
          python scripts/render_prod_state.py \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir /tmp/prod-state-site
          test -s /tmp/prod-state-site/index.html
          test -s /tmp/prod-state-site/dashboard.js
          test -s /tmp/prod-state-site/state.json

      - name: Lint YAML
        run: yamllint .github/workflows ansible
