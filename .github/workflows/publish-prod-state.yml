---
name: Publish Prod State

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/prod-components.json"
      - ".github/workflows/publish-prod-state.yml"
      - "scripts/render_prod_state.py"

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Render production state
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and all state tags
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render production state
        run: |
          python scripts/render_prod_state.py \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir _site

      - name: Initialize missing live state refs
        run: |
          jq -r '
            .components[] |
            .component_id as $component |
            to_entries[] |
            select(
              (.key == "approved" or .key == "applied") and
              .value != null
            ) |
            [$component, .key, .value.sha] |
            @tsv
          ' _site/state.json |
          while IFS=$'\t' read -r component kind sha; do
            tag="prod-current/${component}/${kind}"
            if git show-ref --verify --quiet "refs/tags/${tag}"; then
              continue
            fi
            git tag "$tag" "$sha"
            git push origin "refs/tags/${tag}"
          done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy production state
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
