---
name: Publish Prod State

"on":
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: prod-state-dashboard-pages
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    name: Render production state
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and all state tags
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render production state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/render_prod_state.py \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir _site

      - name: Backfill durable rejection markers
        run: |
          jq -r '
            .approval_events |
            to_entries[] |
            select(.value.kind == "rejected") |
            [
              .key,
              (.value.runId | tostring),
              (.value.runAttempt | tostring),
              .value.sha
            ] |
            @tsv
          ' _site/state.json |
          while IFS=$'\t' read -r component run_id run_attempt sha; do
            tag="prod-rejected/${component}/${run_id}-${run_attempt}-${sha:0:7}"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              continue
            fi
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" "$sha" \
              --message "Rejected ${component} at ${sha}"
            git push origin "refs/tags/$tag"
          done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy production state
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: prod-state-dashboard
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
