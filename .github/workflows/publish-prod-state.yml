---
name: Publish Prod State

"on":
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: prod-state-dashboard-pages
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    name: Render production state
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and all state tags
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render production state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/render_prod_state.py \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy production state
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: prod-state-dashboard
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
