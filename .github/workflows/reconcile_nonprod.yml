---
name: Reconcile Nonprod

run-name: "Validate all components at ${{ github.sha }}"

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  prepare:
    name: Load component matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.components.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate and load components
        id: components
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/prod_components.py validate
          MATRIX=$(python3 scripts/prod_components.py head-matrix --sha "$HEAD_SHA")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  reconcile_nonprod_base:
    name: "nonprod-base · ${{ matrix.name }}"
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    concurrency:
      group: nonprod-reconcile
      queue: max
    permissions:
      contents: read
    steps:
      - name: Check out candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}

      - name: Export declared component environment
        env:
          COMPONENT_ENV_JSON: ${{ matrix.env_json }}
        run: python3 scripts/prod_components.py export-env

      - name: Simulate component reconcile in nonprod-base
        env:
          LAB_STAGE: nonprod-base
          COMPONENT: ${{ matrix.id }}
          INVENTORY: inventory/nonprod-base/hosts.yml
          PLAYBOOK: ${{ matrix.playbook }}
          LIMIT: ${{ matrix.limit }}
        run: |
          test -f "ansible/$INVENTORY"
          test -f "ansible/$PLAYBOOK"
          echo "Would reconcile $COMPONENT in $LAB_STAGE"
          echo "ansible-playbook -i $INVENTORY $PLAYBOOK --limit $LIMIT"

  reconcile_dev:
    name: "dev · ${{ matrix.name }}"
    needs: [prepare, reconcile_nonprod_base]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    concurrency:
      group: nonprod-reconcile
      queue: max
    permissions:
      contents: read
    steps:
      - name: Check out candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}

      - name: Export declared component environment
        env:
          COMPONENT_ENV_JSON: ${{ matrix.env_json }}
        run: python3 scripts/prod_components.py export-env

      - name: Simulate component reconcile in dev
        env:
          LAB_STAGE: dev
          COMPONENT: ${{ matrix.id }}
          INVENTORY: inventory/dev/hosts.yml
          PLAYBOOK: ${{ matrix.playbook }}
          LIMIT: ${{ matrix.limit }}
        run: |
          test -f "ansible/$INVENTORY"
          test -f "ansible/$PLAYBOOK"
          echo "Would reconcile $COMPONENT in $LAB_STAGE"
          echo "ansible-playbook -i $INVENTORY $PLAYBOOK --limit $LIMIT"

  reconcile_test:
    name: "test · ${{ matrix.name }}"
    needs: [prepare, reconcile_dev]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    concurrency:
      group: nonprod-reconcile
      queue: max
    permissions:
      contents: read
    steps:
      - name: Check out candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}

      - name: Export declared component environment
        env:
          COMPONENT_ENV_JSON: ${{ matrix.env_json }}
        run: python3 scripts/prod_components.py export-env

      - name: Simulate component reconcile in test
        env:
          LAB_STAGE: test
          COMPONENT: ${{ matrix.id }}
          INVENTORY: inventory/test/hosts.yml
          PLAYBOOK: ${{ matrix.playbook }}
          LIMIT: ${{ matrix.limit }}
        run: |
          test -f "ansible/$INVENTORY"
          test -f "ansible/$PLAYBOOK"
          echo "Would reconcile $COMPONENT in $LAB_STAGE"
          echo "ansible-playbook -i $INVENTORY $PLAYBOOK --limit $LIMIT"

  prepare_prod_approval:
    name: Find changed production components
    needs: [prepare, reconcile_test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.components.outputs.matrix }}
      has_components: ${{ steps.components.outputs.has_components }}
    steps:
      - name: Check out candidate and production tags
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Compare with successfully applied versions
        id: components
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          MATRIX=$(
            python3 scripts/prod_components.py approval-matrix --sha "$HEAD_SHA"
          )
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$(jq '.include | length' <<< "$MATRIX")" -gt 0 ]; then
            echo "has_components=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_components=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Production approval candidates"
            if [ "$(jq '.include | length' <<< "$MATRIX")" -eq 0 ]; then
              echo "No component differs from its latest successful apply."
            else
              jq -r '
                .include[] |
                "- **\(.name)**: \(.reason) (applied: " +
                (if .applied_sha == "" then "never" else .applied_sha[0:7] end) +
                ")"
              ' <<< "$MATRIX"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  request_prod_approval:
    name: "Request ${{ matrix.name }} approval"
    needs: prepare_prod_approval
    if: needs.prepare_prod_approval.outputs.has_components == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_prod_approval.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch component approval workflow
        uses: actions/github-script@v8
        env:
          COMPONENT: ${{ matrix.id }}
          HEAD_SHA: ${{ matrix.sha }}
        with:
          script: |
            await github.request(
              'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'request_prod_approval.yml',
                ref: context.payload.repository.default_branch,
                inputs: {
                  component: process.env.COMPONENT,
                  head_sha: process.env.HEAD_SHA,
                },
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              }
            );
