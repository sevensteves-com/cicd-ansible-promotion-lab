---
name: Request Prod Approval

run-name: "Approve ${{ inputs.component }} at ${{ inputs.head_sha }}"

"on":
  workflow_dispatch:
    inputs:
      component:
        description: "Declared component to approve"
        required: true
      head_sha:
        description: "SHA that passed nonprod-base, dev, and test"
        required: true

concurrency:
  group: prod-approval-${{ inputs.component }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate component request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      component: ${{ steps.component.outputs.component }}
    steps:
      - name: Check out validated SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve declared component
        id: component
        env:
          COMPONENT: ${{ inputs.component }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          MATRIX=$(python3 scripts/prod_components.py head-matrix --sha "$HEAD_SHA")
          ITEM=$(
            jq -c --arg component "$COMPONENT" \
              '.include[] | select(.id == $component)' <<< "$MATRIX"
          )
          if [ -z "$ITEM" ]; then
            echo "::error::$COMPONENT is not declared at $HEAD_SHA"
            exit 1
          fi
          echo "component=$ITEM" >> "$GITHUB_OUTPUT"

  approve_component:
    name: "Approve ${{ inputs.component }}"
    needs: prepare
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      actions: write
    steps:
      - name: Verify prod environment is protected
        uses: actions/github-script@v8
        with:
          script: |
            const response = await github.request(
              'GET /repos/{owner}/{repo}/environments/{environment_name}',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: 'prod',
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              }
            );
            const reviewerRule = response.data.protection_rules?.find(
              rule => rule.type === 'required_reviewers'
            );
            if (!reviewerRule || reviewerRule.reviewers.length === 0) {
              core.setFailed('prod has no required reviewers');
            }

      - name: Check out validated SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      # The workspace sits at the PR head, which is not approved yet and may
      # not carry this tooling at all. Marker helpers always come from main.
      - name: Check out marker tooling
        uses: actions/checkout@v6
        with:
          ref: main
          path: .marker-tools
          sparse-checkout: scripts/create_marker_tag.sh
          sparse-checkout-cone-mode: false

      - name: Create immutable component approval tag
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          SHA: ${{ inputs.head_sha }}
        run: |
          TAG="prod-approved/${COMPONENT}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHA:0:7}"
          bash .marker-tools/scripts/create_marker_tag.sh "$TAG" "$SHA" \
            "Approve ${COMPONENT} at ${SHA}"

      - name: Dispatch exact component reconcile
        uses: actions/github-script@v8
        env:
          COMPONENT: ${{ inputs.component }}
          SHA: ${{ inputs.head_sha }}
        with:
          script: |
            await github.request(
              'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'reconcile_prod.yml',
                ref: context.payload.repository.default_branch,
                inputs: {
                  component: process.env.COMPONENT,
                  sha: process.env.SHA,
                },
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              }
            );

  publish_rejected_state:
    name: Refresh rejected approval state
    needs: [prepare, approve_component]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.approve_component.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Classify approval failure
        id: decision
        uses: actions/github-script@v8
        with:
          script: |
            const response = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 20,
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              }
            );
            const approvalJob = response.data.jobs.find(
              job => job.name === `Approve ${{ inputs.component }}`
            );
            const rejected = approvalJob?.conclusion === 'failure' &&
              (approvalJob.steps || []).length === 0;
            core.setOutput('rejected', String(rejected));

      - name: Check out rejected SHA
        if: steps.decision.outputs.rejected == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Check out marker tooling
        if: steps.decision.outputs.rejected == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          path: .marker-tools
          sparse-checkout: scripts/create_marker_tag.sh
          sparse-checkout-cone-mode: false

      - name: Record immutable component rejection
        if: steps.decision.outputs.rejected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          SHA: ${{ inputs.head_sha }}
        run: |
          TAG="prod-rejected/${COMPONENT}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHA:0:7}"
          bash .marker-tools/scripts/create_marker_tag.sh "$TAG" "$SHA" \
            "Rejected ${COMPONENT} at ${SHA}"

      - name: Dispatch dashboard publish
        uses: actions/github-script@v8
        with:
          script: |
            await github.request(
              'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'publish-prod-state.yml',
                ref: context.payload.repository.default_branch,
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              }
            );
