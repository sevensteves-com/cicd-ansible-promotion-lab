---
- name: Reconcile certificate sync lab component
  hosts: lab
  gather_facts: false

  vars:
    release_marker: "certificate-sync-v1"

  tasks:
    - name: Show independently promoted certificate sync version
      ansible.builtin.debug:
        msg:
          stage: "{{ lookup('ansible.builtin.env', 'LAB_STAGE') }}"
          component: "{{ lookup('ansible.builtin.env', 'LAB_COMPONENT') }}"
          marker: "{{ release_marker }}"
          commit: "{{ lookup('ansible.builtin.env', 'APPROVED_SHA') }}"
