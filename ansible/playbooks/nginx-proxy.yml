---
- name: Reconcile nginx proxy lab component
  hosts: lab
  gather_facts: false

  vars:
    release_marker: "nginx-proxy-v2"

  tasks:
    - name: Show independently promoted nginx proxy version
      ansible.builtin.debug:
        msg:
          stage: "{{ lookup('ansible.builtin.env', 'LAB_STAGE') }}"
          component: "{{ lookup('ansible.builtin.env', 'LAB_COMPONENT') }}"
          marker: "{{ release_marker }}"
          commit: "{{ lookup('ansible.builtin.env', 'APPROVED_SHA') }}"
